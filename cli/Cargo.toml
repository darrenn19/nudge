[package]
name = "nudge-cli"
description = "Command-line tool for testing and benchmarking the Nudge core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "nudge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
nudge-core = { path = "../core" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }

[lints]
workspace = true
