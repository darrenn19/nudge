name: nudge
description: "Fast, private file transfer between your devices."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  mobile_scanner: ^7.4.2
  nudge_bridge:
    path: rust_builder
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
