[package]
name = "nudge_bridge"
description = "Glue between the Flutter app and nudge-core (flutter_rust_bridge)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.13.0"
log = "0.4"
nudge-core = { path = "../../core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# The mirror window (src/mirror/): GPU decode (Media Foundation) and drawing
# (Direct3D 11), as measured in spikes/mirror-latency.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_WiFi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

# The background service's way in (src/android.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
