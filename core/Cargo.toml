[package]
name = "nudge-core"
description = "Nudge transfer engine: protocol, transport, crypto, discovery. UI-agnostic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nudge_core"

[dependencies]
blake3 = "1.8.7"
cpu-time = "1.0.0"
crc32fast = "1.4"
httparse = "1.10"
if-addrs = "0.15.0"
log = { version = "0.4", features = ["std"] }
mdns-sd = "0.21.6"
rcgen = { version = "0.14.7", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
socket2 = "0.6.5"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }

# Adapter descriptions ("Remote NDIS based Internet Sharing Device"): on
# Windows a phone's cable shows up as just "Ethernet 3" otherwise.
[target.'cfg(windows)'.dependencies]
ipconfig = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
zip = { version = "2.2", default-features = false }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
